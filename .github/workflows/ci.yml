name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --requirement requirements.txt
      - run: python -m py_compile app/server.py app/worker.py scripts/backup.py scripts/verify_backup.py scripts/restore.py
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker build --tag sosopo:ci .
