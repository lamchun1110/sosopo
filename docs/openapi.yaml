openapi: 3.1.0
info:
  title: Sosopo HTTP API
  version: '1.0'
  description: >-
    Every endpoint Sosopo exposes. Requests and responses are JSON unless
    noted. Errors share one shape: an object with a human-readable `error`
    string. Tenant scope is always taken from the session's active
    workspace on the server; no endpoint accepts a workspace id from the
    client to select a tenant.
servers:
  - url: /
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sosopo_session
      description: Set by /api/setup, /api/login, /api/signup, and the SSO callback.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required on every state-changing request. Read it from
        GET /api/session as `csrf_token`.
  responses:
    Error:
      description: The request was refused; `error` explains why.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
paths:
  /api/admin/ai-providers:
    get:
      summary: Instance-wide AI provider configuration (never returns keys).
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Save an instance-wide AI provider credential.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/ai-providers/{provider}/models:
    get:
      summary: Refresh one instance provider's model catalog.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/ai-providers/{provider}/remove:
    post:
      summary: Remove an instance-wide AI provider credential.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/audit-events:
    get:
      summary: Recent audit events.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/status:
    get:
      summary: Queue depth, worker heartbeat, and the newest delivery failure.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      summary: All instance users.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Create an instance user.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/disable:
    post:
      summary: Disable one instance user.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces:
    get:
      summary: Audited, metadata-only listing of every workspace.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/ai/generate:
    post:
      summary: Generate post copy. Spends one AI credit.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/ai/providers:
    get:
      summary: AI providers available to the caller, with their model catalogs.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/oidc/callback:
    get:
      summary: Complete the OIDC flow and open a session.
      security: []
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/oidc/login:
    get:
      summary: Begin the OIDC authorization-code flow.
      security: []
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/billing/webhook:
    post:
      summary: Stripe webhook. Verified by signature, not by session.
      security: []
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/campaigns:
    get:
      summary: AI-planned campaigns for the active workspace, with draft counts.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Plan a brief into reviewable drafts. Spends one AI credit per draft.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/connections:
    get:
      summary: Connected provider accounts, with health, for the active workspace.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Add a provider account with encrypted credentials.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/connections/{id}/disable:
    post:
      summary: Disable one provider account.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/connections/{id}/rotate:
    post:
      summary: Replace one provider account's credentials.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/dashboard:
    get:
      summary: Posts, connections, and channel status for the active workspace.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/health:
    get:
      summary: Liveness and database reachability.
      security: []
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    head:
      summary: Liveness probe without a body.
      security: []
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/invitations/{token}:
    get:
      summary: Preview one invitation before accepting it.
