      summary: Create a draft post for the active workspace.
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/posts/{id}/delete-from-channels:
    post:
      summary: Delete one delivered post at the providers.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
