        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Create a workspace inside one organization.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success. }
        default: { $ref: '#/components/responses/Error' }
  /api/posts:
